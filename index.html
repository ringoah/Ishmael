<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캐릭터 안내</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="stage">
    <div id="intro-phrase">
      <span class="headline">Lumina</span>
      <span class="subline">루미나: 빛, 광원, 밝게 빛나는 것을 아우러 이르는 말.</span>
    </div>

    <div id="carousel">
      <div class="char-slide">
        <div class="char-panel" id="char-panel">
          <button class="collapse-btn" id="collapse-btn" aria-label="상자 크기 전환"><i class="fa-solid fa-chevron-left"></i></button>

          <div class="char-header">
            <p class="char-catch" id="char-catch"></p>
            <h2 class="char-name" id="char-name"></h2>
            <p class="char-meta" id="char-meta"></p>
          </div>

          <div class="char-tabs" id="char-tabs"></div>

          <div class="char-sections" id="char-sections"></div>
        </div>

        <div class="char-image-wrap" id="char-image-wrap">
          <img class="char-image" id="char-image" alt="" draggable="false" />
        </div>
      </div>

      <div class="dots" id="dots" hidden></div>
    </div>

    <button class="mobile-info-btn" id="mobile-info-btn" aria-label="캐릭터 정보 보기"><i class="fa-solid fa-info"></i></button>

    <div class="bgm-control">
      <input class="bgm-volume" id="bgm-volume" type="range" min="0" max="100" value="50" aria-label="배경음악 볼륨" />
      <button class="bgm-btn" id="bgm-btn" aria-label="배경음악 재생/정지"><i class="fa-solid fa-music"></i></button>
    </div>
    <div id="bgm-player"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
